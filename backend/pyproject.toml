[project]
name = "knowledge-qa-backend"
version = "0.1.0"
description = "Enterprise knowledge Q&A (RAG) backend"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "openai>=1.55",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "charset-normalizer>=3.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
