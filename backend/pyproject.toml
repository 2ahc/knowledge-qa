# 后端依赖清单（uv 管理，锁定版本见 uv.lock）
[project]
name = "knowledge-qa-backend"
version = "0.1.0"
description = "企业级知识问答（RAG）后端"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Web 框架与服务器
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # 数据库：SQLAlchemy 2.0 + Alembic 迁移 + pgvector 向量扩展 + psycopg 驱动
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    # 数据校验与配置
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # 认证：JWT 签发校验 + bcrypt 密码哈希
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    # 文件上传（multipart 表单）
    "python-multipart>=0.0.12",
    # 百炼模型调用（OpenAI 兼容客户端）+ 重排接口直连
    "openai>=1.55",
    "httpx>=0.27",
    # 文档解析：PDF / Word / Excel / 文本编码探测
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "charset-normalizer>=3.4",
]

# 开发依赖（生产镜像不安装）
[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false  # 本项目不作为可安装包，仅管理依赖环境

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # 让测试能以 app.* 导入后端代码
