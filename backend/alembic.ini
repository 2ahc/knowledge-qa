# Alembic 数据库迁移配置。
# 迁移脚本位于 migrations/；数据库连接串在 migrations/env.py 里
# 从应用配置(settings.database_url)动态注入，不写死在这里。
[alembic]
script_location = migrations
prepend_sys_path = .
# 迁移文件名模板：日期_版本号_说明，便于按时间排序
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
