# 一键部署编排：4 个服务
#   postgres  —— PostgreSQL 16 + pgvector/pg_trgm 扩展（数据持久化在 pgdata 卷）
#   backend   —— FastAPI 应用（启动时自动执行数据库迁移）
#   worker    —— 后台任务消费者（文档索引/评测），与 backend 共用镜像和上传卷
#   frontend  —— Vue3 前端（nginx 托管静态资源 + 反代 /api，对外端口 8090）
#
# 启动：docker compose up -d --build
# 注意：切勿随意 docker compose down -v，会清空数据库与上传文件！
services:
  postgres:
    image: pgvector/pgvector:pg16  # 自带 pgvector 扩展的官方镜像
    container_name: kqa-postgres
    environment:
      # 口令支持通过 .env / 环境变量注入（KQA_DB_PASSWORD 等），
      # 默认值保持向后兼容；注意已初始化的数据卷不会因改口令而变更
      POSTGRES_USER: ${KQA_DB_USER:-kqa}
      POSTGRES_PASSWORD: ${KQA_DB_PASSWORD:-kqa_pass}
      POSTGRES_DB: ${KQA_DB_NAME:-knowledge_qa}
    ports:
      - "5432:5432"  # 映射到宿主机，便于本地调试直连
    volumes:
      - pgdata:/var/lib/postgresql/data  # 数据持久化
    healthcheck:
      # backend/worker 依赖此健康检查：数据库就绪后才启动
      # $$ 转义：让变量在容器内展开（容器环境里有 POSTGRES_USER），
      # 否则 compose 解析期就会用宿主环境的空值替换
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: kqa-backend
    env_file: .env  # API Key、模型配置等敏感项从 .env 注入
    environment:
      # 容器内走服务名 postgres 连接数据库（覆盖 .env 里的本机地址）
      DATABASE_URL: postgresql+psycopg://${KQA_DB_USER:-kqa}:${KQA_DB_PASSWORD:-kqa_pass}@postgres:5432/${KQA_DB_NAME:-knowledge_qa}
      RUN_WORKER: "false"  # 生产环境由独立 worker 容器消费任务，避免重复消费
      UPLOAD_DIR: /app/uploads  # 容器内上传目录（与 worker 共享卷）
    volumes:
      - uploads:/app/uploads  # 上传文件持久化，且与 worker 共享
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend.Dockerfile  # 复用 backend 镜像，只改启动命令
    container_name: kqa-worker
    command: ["/app/.venv/bin/python", "-m", "app.worker"]  # 独立进程消费任务队列
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${KQA_DB_USER:-kqa}:${KQA_DB_PASSWORD:-kqa_pass}@postgres:5432/${KQA_DB_NAME:-knowledge_qa}
      RUN_WORKER: "false"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads  # 必须与 backend 同卷：读取上传的原始文件
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: kqa-frontend
    ports:
      - "8090:80"  # 浏览器访问入口：http://localhost:8090
    depends_on:
      - backend

volumes:
  pgdata:   # 数据库数据
  uploads:  # 上传的原始文档
