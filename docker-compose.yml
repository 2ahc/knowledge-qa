services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kqa-postgres
    environment:
      POSTGRES_USER: kqa
      POSTGRES_PASSWORD: kqa_pass
      POSTGRES_DB: knowledge_qa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kqa -d knowledge_qa"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
