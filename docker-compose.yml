services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kqa-postgres
    environment:
      POSTGRES_USER: kqa
      POSTGRES_PASSWORD: kqa_pass
      POSTGRES_DB: knowledge_qa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kqa -d knowledge_qa"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: kqa-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://kqa:kqa_pass@postgres:5432/knowledge_qa
      RUN_WORKER: "false"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: kqa-worker
    command: ["/app/.venv/bin/python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://kqa:kqa_pass@postgres:5432/knowledge_qa
      RUN_WORKER: "false"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: kqa-frontend
    ports:
      - "8090:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
