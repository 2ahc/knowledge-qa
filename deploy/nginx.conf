# 前端 nginx 配置：
#   /      —— 托管 Vue 构建产物；history 路由回退到 index.html
#   /api/  —— 反代到 backend 容器，前后端同源，浏览器侧无 CORS 问题
server {
    listen 80;
    client_max_body_size 60m;  # 上传大小上限（略大于后端 50MB 限制，错误交给后端返回）

    location / {
        root /usr/share/nginx/html;
        # Vue Router history 模式：静态文件不存在时回退到单页入口
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE 流式问答关键配置：关闭代理缓冲，回答才能逐字实时透传
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;  # 长生成（大文档/慢模型）不断连
    }
}
